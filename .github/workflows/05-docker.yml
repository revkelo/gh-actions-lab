# =============================================================
# LECCION 5 — Build y publicacion de imagen Docker
# Objetivo: buildx, cache de capas en GitHub, tags automaticos
# y push a GHCR usando el GITHUB_TOKEN (sin secretos propios).
# La imagen queda en: ghcr.io/<tu-usuario>/gh-actions-lab
# =============================================================
name: 05 - Docker a GHCR

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write # necesario para publicar en GHCR

    steps:
      - uses: actions/checkout@v5

      # buildx habilita cache avanzado y builds multiplataforma.
      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      # En PRs NO publicamos: solo verificamos que la imagen compile.
      - name: Login en GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # lo genera GitHub solo

      # Calcula los tags y labels segun el evento:
      #   push a main  -> :main y :sha-abc1234
      #   tag v1.2.3   -> :1.2.3, :1.2, :latest
      - name: Calcular tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache de capas guardado en el almacenamiento de Actions:
          # la segunda build baja de ~40s a ~5s.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Probar la imagen recien construida
        if: github.event_name != 'pull_request'
        run: |
          IMG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker run -d --name lab -p 3000:3000 "$IMG"
          sleep 3
          curl -sf http://localhost:3000/health | grep '"status":"ok"'
          docker rm -f lab
